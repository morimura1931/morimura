name: Build ByTechFlow image

on:
  push:
    paths:
      - '.imageparts/bytechflow-mobile-*.b64'
      - '.github/workflows/build-bytechflow-image.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode optimized WebP
        shell: bash
        run: |
          cat .imageparts/bytechflow-mobile-*.b64 | tr -d '\n' | base64 -d > assets/bytechflow-city-mobile.webp
          file assets/bytechflow-city-mobile.webp
          test "$(wc -c < assets/bytechflow-city-mobile.webp)" -gt 30000

      - name: Commit generated image
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/bytechflow-city-mobile.webp
          git diff --cached --quiet && exit 0
          git commit -m "Build high-resolution ByTechFlow mobile image"
          git push
